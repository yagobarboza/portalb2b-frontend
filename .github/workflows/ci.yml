name: CI — Portal B2B Frontend

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy-production:
    name: Deploy — Google Cloud
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: portal-b2b-frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: project-2295f6f0-ccd8-4a77-96f
      FRONTEND_BUCKET: project-2295f6f0-ccd8-4a77-96f-portal-frontend
      WIF_PROVIDER: projects/702576245812/locations/global/workloadIdentityPools/github-actions/providers/github-provider
      DEPLOYER_SA: portal-github-frontend@project-2295f6f0-ccd8-4a77-96f.iam.gserviceaccount.com
      VITE_API_URL: /api/v1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Gerar frontend de produção
        run: |
          npm ci
          npm run build

      - name: Autenticar no Google Cloud sem chave estática
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Publicar assets antes do HTML
        run: |
          gcloud storage rsync dist "gs://${FRONTEND_BUCKET}" \
            --recursive \
            --exclude='(^|/)index\.html$'

          gcloud storage cp dist/index.html \
            "gs://${FRONTEND_BUCKET}/index.html"

      - name: Configurar cache do HTML e dos assets versionados
        run: |
          gcloud storage objects update \
            "gs://${FRONTEND_BUCKET}/index.html" \
            --cache-control="no-cache,max-age=0,must-revalidate"
          gcloud storage objects update \
            "gs://${FRONTEND_BUCKET}/assets/**" \
            --cache-control="public,max-age=31536000,immutable"

      - name: Validar produção
        run: |
          validate_frontend() {
            local domain="$1"
            local html
            local assets

            html="$(curl --fail --silent --show-error \
              --retry 12 --retry-delay 10 --retry-all-errors \
              "https://${domain}/index.html?deploy=${GITHUB_SHA}")"

            printf '%s' "$html" | grep -q 'id="root"'
            assets="$(printf '%s' "$html" \
              | grep -oE '/assets/[^" ]+\.(js|css)' \
              | sort -u)"

            if [ -z "$assets" ]; then
              echo "Nenhum asset versionado encontrado no HTML de ${domain}." >&2
              exit 1
            fi

            while IFS= read -r asset; do
              curl --fail --silent --show-error \
                --retry 12 --retry-delay 10 --retry-all-errors \
                "https://${domain}${asset}" > /dev/null
            done <<< "$assets"
          }

          validate_frontend app.nydsoftwares.com.br
          validate_frontend portal.fiobikeshop.com.br
